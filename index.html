
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIROIR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#160f14;color:#fff;font-family:'DM Sans',sans-serif}
#mirror{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 10%,#63394c,#160f14 65%)}
#camera{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#lipstick{pointer-events:none;touch-action:none}
#mirror.drawing #lipstick{pointer-events:auto;cursor:crosshair}

header{position:absolute;top:22px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{font:30px Italiana,serif;letter-spacing:5px}
.logo small{display:block;font:9px 'DM Sans';letter-spacing:3px;color:#e9afc2}
.status{font-size:10px;letter-spacing:2px;color:#ffc1d3}

.welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:4;background:#160f145c}
.welcome h1{font:80px Italiana;margin:10px}
.welcome p{font-size:12px;color:#e4cbd5;line-height:1.8;max-width:320px}
button{cursor:pointer;font-family:inherit;color:white}
.start{border:1px solid #e9a5bd;background:#b75d7c;padding:13px 25px;border-radius:30px;margin-top:15px}

.tools{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:6}
.left{left:20px}.right{right:20px}
.tool{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff45;background:#21151dc9;backdrop-filter:blur(15px);font-size:17px}
.tool:hover,.tool.active{background:#b85e7d}

nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#21151dcc;border:1px solid #ffffff35;border-radius:40px;z-index:7;backdrop-filter:blur(20px)}
nav button{border:0;background:none;padding:10px 13px;border-radius:25px;font-size:10px;color:#dfcbd3}
nav button.active,nav button:hover{background:#b85e7d;color:white}

.panel{position:absolute;z-index:8;top:50%;transform:translateY(-50%);width:280px;max-height:65vh;overflow:auto;padding:20px;background:#21151de8;backdrop-filter:blur(25px);border:1px solid #ffffff35;border-radius:18px;display:none}
.panel.open{display:block}
#leftPanel{left:78px}#rightPanel{right:78px}
.panel h2{font:25px Italiana;margin:0 0 15px}
.panel p{font-size:11px;line-height:1.8;color:#d9c5cd}
.close{float:right;background:none;border:0;font-size:20px}
.option{padding:10px 13px;border:1px solid #ffffff35;background:#ffffff0c;border-radius:25px;margin:4px;font-size:10px}
.option.active{background:#b85e7d}
.swatches{display:flex;gap:9px;margin:15px 0}
.swatch{width:28px;height:28px;border-radius:50%;border:1px solid #ffffff70}
#message{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#ffc1d3;z-index:5;white-space:nowrap}
@media(max-width:600px){
header{left:14px;right:14px;top:14px}
.logo{font-size:23px}
.tool{width:38px;height:38px}
.left{left:8px}.right{right:8px}
nav{bottom:10px;gap:0}
nav button{padding:9px 8px;font-size:9px}
#leftPanel{left:53px}#rightPanel{right:53px}
}
</style>
</head>
<body>
<div id="mirror">

<video id="camera" autoplay muted playsinline></video>
<canvas id="face"></canvas>
<canvas id="lipstick"></canvas>

<header>
<div class="logo">MIROIR<small>THE PARTY BATHROOM MIRROR</small></div>
<div class="status" id="status">MIRROR STANDBY</div>
</header>

<div class="welcome" id="welcome">
<div>
<div style="letter-spacing:4px;font-size:10px;color:#e9afc2">A LITTLE GLAMOUR, A LITTLE MISCHIEF</div>
<h1>MIROIR</h1>
<p>Your personal party-bathroom mirror. Get ready, explore makeup, experiment with colour and leave a little lipstick art on the glass.</p>
<button class="start" id="start">STEP UP TO THE MIRROR</button>
</div>
</div>

<div class="tools left">
<button class="tool" id="lighting" title="Lighting">☼</button>
<button class="tool" id="mesh" title="Face mesh">⌘</button>
<button class="tool" id="guides" title="Makeup guides">✧</button>
</div>

<div class="tools right">
<button class="tool" id="profile">♡</button>
<button class="tool" id="tutorial">☷</button>
<button class="tool" id="draw">♥</button>
</div>

<section class="panel" id="leftPanel">
<button class="close" data-close="leftPanel">×</button>
<h2 id="leftTitle">The mirror</h2>
<div id="leftContent"></div>
</section>

<section class="panel" id="rightPanel">
<button class="close" data-close="rightPanel">×</button>
<h2 id="rightTitle">Your mirror notes</h2>
<div id="rightContent"></div>
</section>

<div id="message">NATURAL LIGHT</div>

<nav>
<button class="active" data-mode="mirror">Mirror</button>
<button data-mode="makeup">Makeup</button>
<button data-mode="colour">Colour</button>
<button data-mode="hair">Hair</button>
<button data-mode="inspo">Inspo</button>
</nav>
</div>

<script type="module">
import {
 FaceLandmarker,
 FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const video=$("camera"),mirror=$("mirror");
const faceCanvas=$("face"),ctx=faceCanvas.getContext("2d");
const lipstick=$("lipstick"),lip=lipstick.getContext("2d");

let tracker,landmarks=null,meshOn=true,guidesOn=true;
let drawing=false,strokes=[],current=null;
let lightingMode="Natural",brushColor="#c94f75",brushSize=15;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 [faceCanvas,lipstick].forEach(c=>{
 c.width=innerWidth*d;c.height=innerHeight*d;
 c.style.width="100%";c.style.height="100%";
 c.getContext("2d").setTransform(d,0,0,d,0,0);
 });
 renderFace();
}
window.addEventListener("resize",resize);
resize();

function showPanel(side,title,html){
 $("leftPanel").classList.remove("open");
 $("rightPanel").classList.remove("open");
 $(side+"Title").textContent=title;
 $(side+"Content").innerHTML=html;
 $(side+"Panel").classList.add("open");
}
document.querySelectorAll("[data-close]").forEach(b=>{
 b.onclick=()=>$(b.dataset.close).classList.remove("open");
});

$("start").onclick=async()=>{
 try{
 $("status").textContent="CONNECTING";
 const stream=await navigator.mediaDevices.getUserMedia({
 video:{facingMode:"user",width:1280,height:720},
 audio:false
 });
 video.srcObject=stream;
 await video.play();
 video.style.display="block";
 $("welcome").style.display="none";
 $("status").textContent="LOADING FACE TRACKING";

 const vision=await FilesetResolver.forVisionTasks(
 "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
 );
 tracker=await FaceLandmarker.createFromOptions(vision,{
 baseOptions:{
 modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
 delegate:"GPU"
 },
 runningMode:"VIDEO",
 numFaces:1
 });
 $("status").textContent="FACE TRACKING ON";
 requestAnimationFrame(loop);
 }catch(e){
 console.error(e);
 $("status").textContent="CAMERA UNAVAILABLE";
 alert("Please allow camera access and reload MIROIR.");
 }
};

function loop(){
 if(tracker&&video.readyState>=2){
 const result=tracker.detectForVideo(video,performance.now());
 landmarks=result.faceLandmarks?.[0]||null;
 $("status").textContent=landmarks?"FACE TRACKING ON":"LOOKING FOR FACE";
 renderFace();
 }
 requestAnimationFrame(loop);
}

function xy(p){return{x:(1-p.x)*innerWidth,y:p.y*innerHeight}}
function renderFace(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 if(!landmarks)return;

 if(meshOn){
 ctx.strokeStyle="rgba(255,190,211,.25)";
 ctx.lineWidth=.6;
 for(const edge of FaceLandmarker.FACE_LANDMARKS_TESSELATION){
 const a=xy(landmarks[edge.start]);
 const b=xy(landmarks[edge.end]);
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.stroke();
 }
 }
 if(guidesOn){
 drawGuides();
 }
}

function drawGuides(){
 const line=ids=>{
 ctx.beginPath();
 ids.forEach((id,i)=>{
 const p=xy(landmarks[id]);
 i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
 });
 ctx.strokeStyle="#ff9fbd";
 ctx.lineWidth=2;
 ctx.setLineDash([5,4]);
 ctx.stroke();
 ctx.setLineDash([]);
 };
 line([50,101,118,117,123]);
 line([280,330,347,346,352]);
 line([33,160,158,133]);
 line([362,385,387,263]);

 ctx.fillStyle="#ffb4ca";
 ctx.font="11px DM Sans";
 let a=xy(landmarks[50]),b=xy(landmarks[280]);
 ctx.fillText("BLUSH",a.x-15,a.y-12);
 ctx.fillText("BLUSH",b.x-15,b.y-12);
}

$("lighting").onclick=()=>{
 const choices=["Natural","Warm","Cool","Flash","Soft"];
 showPanel("left","The lighting",
 `<p>Choose your mirror lighting.</p>
 ${choices.map(x=>`<button class="option ${x===lightingMode?"active":""}" data-light="${x}">${x}</button>`).join("")}`);
 document.querySelectorAll("[data-light]").forEach(b=>{
 b.onclick=()=>{
 lightingMode=b.dataset.light;
 const filters={
 Natural:"none",
 Warm:"sepia(.2) saturate(1.1)",
 Cool:"hue-rotate(9deg) saturate(.9)",
 Flash:"brightness(1.2) contrast(1.1)",
 Soft:"brightness(1.12) contrast(.9)"
 };
 video.style.filter=filters[lightingMode];
 $("message").textContent=lightingMode.toUpperCase()+" LIGHT";
 document.querySelectorAll("[data-light]").forEach(x=>x.classList.toggle("active",x===b));
 };
 });
};

$("mesh").onclick=()=>{
 meshOn=!meshOn;
 $("mesh").classList.toggle("active",meshOn);
 renderFace();
};
$("guides").onclick=()=>{
 guidesOn=!guidesOn;
 $("guides").classList.toggle("active",guidesOn);
 renderFace();
};

$("profile").onclick=()=>{
 if(!landmarks){alert("Step in front of the mirror first.");return}
 const width=Math.abs(landmarks[234].x-landmarks[454].x);
 const height=Math.abs(landmarks[10].y-landmarks[152].y);
 const ratio=width/height;
 const shape=ratio>.86?"Wider outline":ratio<.7?"Longer outline":"Balanced outline";
 showPanel("right","Your feature notes",
 `<p><b>Face outline</b><br>${shape}</p>
 <p>Live facial landmarks are tracking your face.</p>
 <p style="color:#cbb9c1">This is a rough 2D estimate, not a definitive face-shape or bone-structure diagnosis. Camera angle can affect it.</p>
 <button class="option" onclick="location.reload()">Rescan</button>`);
};

const tutorialSteps=[
 ["CHEEKS","Use the cheekbone area as a starting point for blush. Blend gently upward toward your temples."],
 ["EYES","Follow your natural eye contour. Experiment with a soft line near the outer corner."],
 ["LIPS","Start at the centre of your lips and work outward with your chosen lip colour."],
 ["FINISH","Add a little highlight wherever you personally enjoy it. Check it in natural light."]
];
let step=0;
function tutorial(){
 showPanel("right","Get ready with me",
 `<p style="color:#f2a6bf">STEP ${step+1} OF 4 · ${tutorialSteps[step][0]}</p>
 <p>${tutorialSteps[step][1]}</p>
 <button class="option" id="next">NEXT STEP →</button>
 <button class="option" id="back">BACK</button>`);
 $("next").onclick=()=>{step=(step+1)%4;tutorial()};
 $("back").onclick=()=>{step=(step+3)%4;tutorial()};
}
$("tutorial").onclick=tutorial;

const modeContent={
 mirror:["The mirror","Your reflection stays centre stage. Use the floating controls to explore the mirror."],
 makeup:["Makeup placement","Pink dotted guides show approximate blush and eye placement. They are guides only. MIROIR never applies makeup to your reflection."],
 colour:["Colour corner","Try rose, berry, mauve, peach and soft brown shades. Webcam lighting changes colour, so treat these as inspiration rather than a definitive undertone analysis."],
 hair:["Hair inspiration","Experiment with soft face-framing layers, a polished bun, a side part or a soft fringe. Your taste and hair texture matter more than a webcam estimate."],
 inspo:["Party inspiration","Romantic editorial: rosy cheeks and blurred lips. 90s party glam: brown-rose lips and softly defined eyes. Ballet-inspired: delicate pink tones and a tidy bun."]
};
document.querySelectorAll("[data-mode]").forEach(b=>{
 b.onclick=()=>{
 document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));
 const [title,content]=modeContent[b.dataset.mode];
 showPanel("left",title,`<p>${content}</p>`);
 };
});

// Lipstick-on-glass drawing mode.
$("draw").onclick=()=>{
 drawing=!drawing;
 mirror.classList.toggle("drawing",drawing);
 $("draw").classList.toggle("active",drawing);
 if(drawing){
 showPanel("left","Lipstick on glass",
 `<p>Leave little lipstick marks on the mirror, just like the party bathroom.</p>
 <div class="swatches">
 ${["#c94f75","#e987a8","#b94b68","#9c4661","#f3c2ce","#ffffff"].map(c=>`<button class="swatch" data-colour="${c}" style="background:${c}"></button>`).join("")}
 </div>
 <p>Smudge size</p><input id="brush" type="range" min="5" max="35" value="15">
 <p><button class="option" id="undo">UNDO</button>
 <button class="option" id="wipe">WIPE MIRROR</button>
 <button class="option" id="done">DONE</button></p>`);
 document.querySelectorAll("[data-colour]").forEach(b=>b.onclick=()=>brushColor=b.dataset.colour);
 $("brush").oninput=e=>brushSize=+e.target.value;
 $("undo").onclick=undo;
 $("wipe").onclick=()=>{strokes=[];redraw()};
 $("done").onclick=()=>$("draw").click();
 }else{
 $("leftPanel").classList.remove("open");
 }
};

function paint(points,color,size){
 if(!points.length)return;
 lip.save();
 lip.lineCap="round";lip.lineJoin="round";
 lip.strokeStyle=color;lip.fillStyle=color;
 lip.globalAlpha=.65;lip.shadowColor=color;lip.shadowBlur=size;
 lip.lineWidth=size;
 if(points.length===1){
 lip.beginPath();lip.arc(points[0].x,points[0].y,size/2,0,Math.PI*2);lip.fill();
 }else{
 lip.beginPath();lip.moveTo(points[0].x,points[0].y);
 points.slice(1).forEach(p=>lip.lineTo(p.x,p.y));
 lip.stroke();
 }
 lip.restore();
}
function redraw(){
 lip.clearRect(0,0,innerWidth,innerHeight);
 strokes.forEach(s=>paint(s.points,s.color,s.size));
}
function undo(){strokes.pop();redraw()}
function pos(e){return{x:e.clientX,y:e.clientY}}
lipstick.addEventListener("pointerdown",e=>{
 if(!drawing)return;
 lipstick.setPointerCapture(e.pointerId);
 current={points:[pos(e)],color:brushColor,size:brushSize};
 strokes.push(current);paint(current.points,current.color,current.size);
});
lipstick.addEventListener("pointermove",e=>{
 if(!current)return;
 const p=pos(e),previous=current.points[current.points.length-1];
 current.points.push(p);paint([previous,p],current.color,current.size);
});
function finish(){current=null}
lipstick.addEventListener("pointerup",finish);
lipstick.addEventListener("pointercancel",finish);

</script>
</body>
</html>
